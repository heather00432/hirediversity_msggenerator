services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    command: --load-only ko,en,zh,ja,vi,ne,uz,mn
    ports:
      - "5000:5000"
    restart: unless-stopped

  app:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
    command: python -m http.server 8080 --bind 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      - libretranslate
    restart: unless-stopped
