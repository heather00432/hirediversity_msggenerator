}

function saveCustomMent() {
  const txtArea = document.getElementById('customKrText');
  const val = txtArea ? txtArea.value.trim() : '';
  if(!val) {
    alert('저장할 멘트를 입력해 주세요.');
    return;
  }
  if(!customSavedMents.includes(val)) {
    customSavedMents.push(val);
    localStorage.setItem('user_saved_ments', JSON.stringify(customSavedMents));
    alert('내 전용 멘트에 저장되었습니다!');
    renderAll();
  }
}

function loadSavedCustomText(idx) {
  state.customText = customSavedMents[idx];
  renderAll();
}

function deleteSavedCustomText(idx, event) {
  event.stopPropagation();
  customSavedMents.splice(idx, 1);
  localStorage.setItem('user_saved_ments', JSON.stringify(customSavedMents));
  renderAll();
}

function selectPresetLang(code) {
  saveCurrentInputs();
  state.isCustomInput = false;
  state.customLangInput = code;
  renderAll();
}

function toggleCustomLangInput(val) {
  saveCurrentInputs();
  state.isCustomInput = val;
  renderAll();
}

function saveApiKey(type, val) {
  if(type === 'claude') {
    state.claudeApiKey = val.trim();
    sessionStorage.setItem('claude_api_key', state.claudeApiKey);
  } else if(type === 'gemini') {
    state.geminiApiKey = val.trim();
    sessionStorage.setItem('gemini_api_key', state.geminiApiKey);
  }
}

async function handleCustomTranslate() {
  saveCurrentInputs();

  if(!state.customText.trim()) {
    alert('번역할 한국어 문장을 입력해주세요.');
    return;
  }

  state.isTranslating = true;
  renderAll();

  try {
    const parsed = parseFlexibleLang(state.customLangInput);
    if(!parsed.code) {
      throw new Error('지원하지 않는 언어입니다. 언어 코드(예: fr, de)를 입력해 주세요.');
    }
    const res = await multiEngineTranslate(state.customText, parsed.code, parsed.name, state.isFirmTone);
    state.customResult = res.text;
    state.usedEngineName = res.engine;
  } catch(err) {
    console.error(err);
    alert('번역 처리 중 오류가 발생했습니다: ' + err.message);
  } finally {
    state.isTranslating = false;
    renderAll();
  }
}

// 3중 하이브리드 번역 엔진 (1순위 Gemini ➔ 2순위 Claude ➔ 3순위 Google Web)
async function multiEngineTranslate(text, langCode, langName, isFirm) {
  const toneInstruction = isFirm 
    ? "Use a firm, authoritative, strict official policy tone (commanding / mandatory administrative style)."
    : "Use a polite, clear, and professional administrative service tone.";
  const engineLangName = langCode === 'en' ? 'English (en)' : langName;

  const useEnglishBridge = langCode !== 'en';

  // 1순위: Gemini AI Engine (메인)
  if(state.geminiApiKey) {
    try {
      const resText = await translateWithGeminiPipeline(state.geminiApiKey, text, engineLangName, toneInstruction, useEnglishBridge);
      return { text: resText, engine: useEnglishBridge ? 'Google Gemini 1.5 AI · 영어 경유' : 'Google Gemini 1.5 AI (메인)' };
    } catch(e) { console.warn('Gemini Error, fallbacking...', e); }
  }

  // 2순위: Claude AI Engine (보조)
  if(state.claudeApiKey) {
    try {
      const resText = await translateWithClaudePipeline(state.claudeApiKey, text, engineLangName, toneInstruction, useEnglishBridge);
      return { text: resText, engine: useEnglishBridge ? 'Claude 3.5 Sonnet AI · 영어 경유' : 'Claude 3.5 Sonnet AI (보조)' };
    } catch(e) { console.warn('Claude Error, fallbacking...', e); }
  }

  // 3순위: Google Translate Free Web API
  try {
    const englishText = useEnglishBridge ? await translateWithFreeApi(text, 'en') : text;
    const resText = langCode === 'en'
      ? await translateWithFreeApi(text, 'en')
      : await translateWithFreeApi(englishText, langCode);
    return { text: resText, engine: useEnglishBridge ? 'Google Translate · 영어 경유' : 'Google Translate (기본 Web)' };
  } catch(e) {
    throw new Error('모든 번역 엔진 연결 실패');
  }
}

async function translateWithGemini(apiKey, text, targetLangName, toneInstruction, sourceLangName = 'Korean') {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: `You are an expert administrative translator specializing in Korean visa document verification.
Instruction: Translate the following ${sourceLangName} text into ${targetLangName}.
Requirements:
1. Preserve technical visa terms like HiKorea, RC, D-2, D-4 without wrong literal translation.
2. ${toneInstruction}
3. Output ONLY plain text. Do not output HTML, XML, Markdown, or entities such as &amp;#39;.
4. Preserve apostrophes and punctuation naturally in ${targetLangName}.

${text}`
        }]
      }]
    })
  });
  if(!response.ok) throw new Error(`Gemini HTTP ${response.status}`);
  const data = await response.json();
  if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
    return decodeHtmlEntities(data.candidates[0].content.parts[0].text).trim();
  }
  throw new Error('Gemini API Error');
}

async function translateWithGeminiPipeline(apiKey, text, targetLangName, toneInstruction, useEnglishBridge) {
  if(!useEnglishBridge) return translateWithGemini(apiKey, text, targetLangName, toneInstruction);
  const englishText = await translateWithGemini(apiKey, text, 'English', toneInstruction, 'Korean');
  return translateWithGemini(apiKey, englishText, targetLangName, toneInstruction, 'English');
}

async function translateWithClaude(apiKey, text, targetLangName, toneInstruction, sourceLangName = 'Korean') {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'dangerously-allow-browser': 'true'
    },
    body: JSON.stringify({
      model: 'claude-3-5-sonnet-20241022',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: `Translate the following ${sourceLangName} text into ${targetLangName}. Tone requirement: ${toneInstruction}. Output ONLY plain text without HTML entities or Markdown:\n\n${text}`
      }]
    })
  });
  if(!response.ok) throw new Error(`Claude HTTP ${response.status}`);
  const data = await response.json();
  if (data.content && data.content[0] && data.content[0].text) {
    return decodeHtmlEntities(data.content[0].text).trim();
  }
  throw new Error('Claude API Error');
}

async function translateWithClaudePipeline(apiKey, text, targetLangName, toneInstruction, useEnglishBridge) {
  if(!useEnglishBridge) return translateWithClaude(apiKey, text, targetLangName, toneInstruction);
  const englishText = await translateWithClaude(apiKey, text, 'English', toneInstruction, 'Korean');
  return translateWithClaude(apiKey, englishText, targetLangName, toneInstruction, 'English');
}

async function translateWithFreeApi(text, targetLangCode) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|${targetLangCode}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`무료 번역 API HTTP ${res.status}`);
  const json = await res.json();
  if(json.responseData && json.responseData.translatedText) {
    return decodeHtmlEntities(json.responseData.translatedText).trim();
  }
  throw new Error('무료 API 오류');
}

function copyFromButton(btnEl) {
  copyTextOnly(btnEl?.dataset.copyText || '', btnEl);
}

function copyCombinedFromButton(btnEl) {
  copyFullCombined(btnEl?.dataset.copyTranslation || '', btnEl?.dataset.copyOriginal || '', btnEl);
}

function copyTextOnly(text, btnEl) {
  const done = () => {
    if(btnEl) {
      const origText = btnEl.textContent;
      btnEl.textContent = '✓ 복사완료';
      btnEl.classList.add('copied');
      setTimeout(() => {
        btnEl.textContent = origText;
        btnEl.classList.remove('copied');
      }, 1500);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function copyFullCombined(transText, origText, btnEl) {
  const combined = `${transText}\n${origText}`;
  copyTextOnly(combined, btnEl);
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let copied = false;
  try{ copied = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(copied) cb();
}

function renderAll(){
  renderRail();
  bindSettingsPanel();
  const inner = document.getElementById('mainInner');

  if(state.catId === 'custom-translator') {
    inner.innerHTML = renderCustomTranslatorView();
    return;
  }

  let items = [];
  let cat = null;

  if(state.catId === 'favorites') {
    const all = getAllFlatItems();
    items = all.filter(e => favorites.includes(e.key));
    cat = { name: '⭐ 즐겨찾기 한 보완 멘트', desc: '자주 사용하는 멘트 모음입니다.' };
  } else if(state.searchQuery) {
    const all = getAllFlatItems();
    const q = normalizeSearchText(state.searchQuery);
    items = all.filter(e => [e.item.condition, e.item.kr, e.group, e.catName]
      .some(value => normalizeSearchText(value).includes(q)));
    cat = { name: `🔍 검색 결과: "${state.searchQuery}"`, desc: `총 ${items.length}개의 보완 멘트가 검색되었습니다.` };
  } else {
    cat = DATA.categories.find(c => c.id === state.catId);
    items = flatItems(cat);
  }

  inner.innerHTML =
    '<div class="cat-header"><div><h1>'+escapeHtml(cat.name)+'</h1><p>'+escapeHtml(cat.desc)+'</p></div>'+
    '<div class="cat-count">'+items.length+' MENTS</div></div>'+
    '<div class="work">'+
      '<div class="col-main">'+
        renderItemList(items, cat)+
      '</div>'+
      '<div class="right-sticky-container">'+
        renderStickyDetailCard(cat, items)+
        renderStickyResultCard(cat, items)+
        renderReferencePanel(cat)+
      '</div>'+
    '</div>';

  inner.querySelectorAll('.item-row').forEach(btn => {
    btn.addEventListener('click', () => {
      saveCurrentInputs();
      state.itemKey = btn.getAttribute('data-key');
      const itemCat = btn.getAttribute('data-cat');
      if(itemCat && state.catId !== 'favorites' && !state.searchQuery) state.catId = itemCat;
      state.lang = null;
      state.isItemCustomActive = false;
      state.itemCustomResult = '';
      renderAll();
    });
  });
}

renderAll();
